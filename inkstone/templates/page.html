{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ site.title }}{% endblock %}

{% block content %}
<article>
  <h1>{{ page.title }}</h1>
  {% if page.date %}
  <p class="meta"><time datetime="{{ page.date | date('%Y-%m-%d') }}">{{ page.date | date('%d %B %Y') }}</time></p>
  {% endif %}
  {{ page.content }}
  {% if page.tags %}
  <p class="tags">{{ page.tags | join(", ") }}</p>
  {% endif %}
</article>
{% endblock %}
