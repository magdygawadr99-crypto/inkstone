{% extends "base.html" %}

{% block title %}{{ tag }} - {{ site.title }}{% endblock %}

{% block content %}
<h1>Tagged &ldquo;{{ tag }}&rdquo;</h1>
<ul class="posts">
  {% for post in posts %}
  <li>
    <time datetime="{{ post.date | date('%Y-%m-%d') }}">{{ post.date | date('%Y-%m-%d') }}</time>
    <a href="{{ post.url }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
{% endblock %}
